[project]
name = "invoice-sorting"
version = "0.2.4"
description = "个人发票报销管理工具"
readme = "README.md"
authors = [
    { name = "lsgoodlionel", email = "lsgood.lionel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45",  # 私有化授权令牌的 Ed25519 签名与验签
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
# 截图/图片凭证文字识别（离线 OCR），服务器部署默认安装
ocr = [
    "rapidocr>=3.9",
    "onnxruntime>=1.20",
]

[project.scripts]
invoice-sorting = "invoice_sorting.main:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "reportlab>=5.0.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
